
spring.application.name=SpringProjectTeam2
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# Browser origins allowed to call the API and connect to the WebSocket endpoint.
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:https://infosys-springboard-internship-l6uy.onrender.com,http://localhost:*,http://127.0.0.1:*}
app.ws.allowed-origin-patterns=${APP_WS_ALLOWED_ORIGIN_PATTERNS:https://infosys-springboard-internship-l6uy.onrender.com,http://localhost:*,http://127.0.0.1:*}

# Admin registration
app.security.admin-registration-key=${ADMIN_REGISTRATION_KEY:}
app.security.hr-setup-key=${HR_SETUP_KEY:}

# JWT configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
